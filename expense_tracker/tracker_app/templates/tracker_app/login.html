{% extends 'tracker_app/base.html' %}
{% load currency_filters %}

{% block title %}Đăng Nhập - Quản Lý Chi Tiêu Sinh Viên PTIT{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-ic"><i class="fa-solid fa-lock"></i></div>
        <h5 class="auth-t">Đăng nhập hệ thống</h5>
        <form method="POST" action="{% url 'login' %}" id="loginForm" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="loginEmail">Email:</label>
                <div class="inp">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" class="form-control" id="loginEmail" name="username" placeholder="sinhvien@ptit.edu.vn" value="{{ username_value|default:'' }}" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="loginPassword">Mật khẩu:</label>
                <div class="inp">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" class="form-control" id="loginPassword" name="password" placeholder="********" required>
                    <button type="button" class="tg" onclick="var i=document.getElementById('loginPassword');i.type=i.type==='password'?'text':'password';"><i class="fa-regular fa-eye-slash"></i></button>
                </div>
            </div>
            <button type="submit" class="btn btn-ptit auth-btn mt-2">Đăng nhập</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('loginForm').addEventListener('submit',function(e){if(!this.checkValidity()){e.preventDefault();e.stopPropagation();}this.classList.add('was-validated');});
</script>
{% endblock %}
